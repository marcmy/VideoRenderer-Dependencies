version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "marcmy/VideoRenderer*"
    groups:
      routine-actions:
        patterns: ["actions/*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
