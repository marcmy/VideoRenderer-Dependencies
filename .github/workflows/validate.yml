name: Validate dependency configuration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install the small YAML validation dependency
        run: python -m pip install --disable-pip-version-check -r .github/requirements-validation.txt
      - name: Verify workflow contracts and rejection fixtures
        run: python .github/dependency-maintenance.py --self-test
